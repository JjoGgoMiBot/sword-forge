<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>검 강화하기</title>
<style>
:root{
  --bg:#0b0c11; --panel:#14161f; --panel2:#1b1e2a; --line:#2a2e3d; --text:#e9e6dd; --muted:#8c8a85;
  --gold:#f2c14e; --ok:#4fd18b; --keep:#8fa3c4; --fail:#f08a4b; --boom:#ff4d5e; --shard:#7fd3ff; --xp:#ffd36b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0}
img.ic{width:20px;height:20px;object-fit:contain;vertical-align:-5px;flex:none}
.wrap{max-width:520px;margin:0 auto;padding:10px 16px 40px}
/* 대장장이 카드 */
.smith{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.smith .badge{width:52px;height:52px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 8px #0008)}
.smith .info{flex:1;min-width:0}
.smith .rk{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smith .rk small{color:var(--xp);font-weight:800;margin-right:6px}
.xpbar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c98a1c,#ffd36b);transition:width .3s}
.xpt{font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.sq{position:relative;width:42px;height:42px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.sq img{width:28px;height:28px;object-fit:contain}
.sq svg{width:24px;height:24px;color:#d9b56a}
.volpop{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:230px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px #000a;display:none}
.volpop.on{display:block;animation:in .18s}
.volpop .row{display:flex;align-items:center;gap:10px}
.volpop .row b{min-width:38px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.volpop input[type=range]{flex:1;accent-color:#d9b56a;height:28px}
.volpop label{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted);cursor:pointer}
.volpop label input{accent-color:#d9b56a;width:16px;height:16px}
@media(max-width:420px){.smith{gap:6px;padding:8px} .smith .badge{width:42px;height:42px} .sq{width:36px;height:36px;border-radius:10px} .sq img{width:24px;height:24px} .sq svg{width:20px;height:20px} .smith .rk{font-size:14px} .smith .rk small{display:block;font-size:11px;margin:0}}
.sq .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--boom);color:#fff;font-size:11px;font-weight:800;display:none;place-items:center}
.sq .dot.on{display:grid;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.res div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 9px;display:flex;align-items:center;gap:7px}
.res img{width:26px;height:26px;object-fit:contain}
.res span{font-size:11px;color:var(--muted);line-height:1.1}
.res b{display:block;font-size:16px;color:var(--text);font-variant-numeric:tabular-nums}
.res .g b{color:var(--gold)} .res .s b{color:var(--shard)}
.buffs{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;margin-top:8px}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px 3px 4px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.chip img{width:20px;height:20px;object-fit:contain}
.chip.good{border-color:#2f6b4c;color:#9ff0c3} .chip.bad{border-color:#7a2e37;color:#ffb0b8}
/* 무대 */
.stage{position:relative;margin-top:6px;border-radius:20px;background:#0d0e14;border:2px solid var(--line);transition:border-color .4s;overflow:hidden;aspect-ratio:1/1}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38;filter:saturate(.9)}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 45%,transparent 0%,#0b0c11cc 100%);pointer-events:none}
canvas#back{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;mix-blend-mode:screen}
.bgimg{transition:opacity .35s,filter .8s}
.stage[data-tier="4"] .bgimg{filter:saturate(1.2) brightness(1.15)}
.stage[data-tier="5"]{box-shadow:0 0 40px #ffffff55,inset 0 0 70px #ffffff33}
.stage[data-tier="5"] .bgimg{opacity:.22}
.stage.cut .bgimg{opacity:.04}
.cutin{position:absolute;left:0;right:0;top:12%;text-align:center;z-index:6;pointer-events:none;opacity:0}
.cutin small{display:block;font-size:13px;letter-spacing:.4em;color:#e8e4da;text-shadow:0 2px 8px #000}
.cutin b{display:block;font-size:56px;font-weight:900;letter-spacing:.05em;text-shadow:0 0 30px currentColor,0 4px 20px #000}
.cutin.on{animation:cutin var(--d,.8s) cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes cutin{0%{opacity:0;transform:scale(1.8)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.96)}}
.cutin.god b{background:linear-gradient(90deg,#ff7a7a,#ffd36b,#7dff8a,#7fd3ff,#c48bff,#ff8bd8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px #fff8)}
.fork{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#000c;opacity:0;pointer-events:none;transition:opacity .25s}
.fork.on{opacity:1}
.fork small{font-size:13px;color:#c9c5bb;letter-spacing:.2em}
.fork b{font-size:34px;font-weight:900;text-shadow:0 0 24px currentColor}
.fork em{font-style:normal;font-size:13px;color:#e8e4da;text-align:center;padding:0 18px;line-height:1.5}
.fork .rare{font-size:15px;font-weight:900;color:#000;background:linear-gradient(90deg,#7dff8a,#ffd36b,#ff8bd8);padding:3px 12px;border-radius:99px;animation:pulse .5s infinite}
.ptabs{display:flex;gap:4px;margin:8px 0}
.ptabs button{flex:1 1 0;min-width:0;padding:7px 2px;border-radius:10px;border:1px solid var(--line);background:#16171f;color:#c9c5bb;font-weight:700;font-size:12px;cursor:pointer}
.ptabs button.on{background:#262838;color:#fff}
.swordimg{position:absolute;left:50%;top:46%;width:84%;transform:translate(-50%,-50%);user-select:none;-webkit-user-drag:none;z-index:2;transition:opacity .2s}
.charging .swordimg{animation:charge .1s linear infinite}
@keyframes charge{50%{transform:translate(calc(-50% + 2px),calc(-50% - 1px))}}
.lvl{position:absolute;left:0;right:0;bottom:10px;text-align:center;z-index:4}
.lvl .n{font-size:36px;font-weight:900;letter-spacing:-.03em;line-height:1;text-shadow:0 2px 12px #000,0 0 3px #000}
.lvl .tr{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.15em;padding:2px 8px;border-radius:6px;border:1px solid currentColor;background:#000a}
.lvl .nm{margin-top:3px;font-size:15px;font-weight:700;text-shadow:0 2px 8px #000}
.pips{display:flex;gap:2px;margin-top:6px}
.pips i{flex:1;height:7px;border-radius:2px;background:#20222c}
.pips i.gap{margin-left:5px}
.pips i.on{background:var(--c);box-shadow:0 0 6px var(--c)}
.pips i.cur{outline:1px solid #fff}
.tag{position:absolute;top:10px;font-size:12px;color:#c9c5bb;background:#000a;padding:4px 8px;border-radius:8px;z-index:4}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;mix-blend-mode:screen}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5}
.banner{position:absolute;left:50%;top:17%;transform:translate(-50%,-50%);font-weight:900;font-size:44px;letter-spacing:-.03em;opacity:0;pointer-events:none;white-space:nowrap;text-shadow:0 4px 24px #000,0 0 3px #000;z-index:6}
.banner.show{animation:pop .95s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}28%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.shake{animation:shake .4s}
.shake.big{animation:shakebig .6s}
@keyframes shakebig{15%{transform:translate(-14px,6px)}30%{transform:translate(12px,-9px)}45%{transform:translate(-10px,-5px)}60%{transform:translate(8px,7px)}80%{transform:translate(-4px,2px)}}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
.notice{display:flex;align-items:center;gap:8px;height:0;margin:0;overflow:hidden;opacity:0;border-radius:12px;border:1px solid transparent;background:linear-gradient(90deg,#2a1d0a,#1a1408 60%,#2a1d0a);font-size:13px;font-weight:700;transition:height .3s,opacity .3s,margin .3s,border-color .3s}
.notice.on{height:34px;margin:0 0 8px;opacity:1;border-color:#6b5520;box-shadow:0 0 18px #ffb34722 inset}
.notice .ico{flex:none;width:34px;height:100%;display:grid;place-items:center;background:#ffb3471f;color:#ffd36b;font-size:15px}
.notice .msg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px;color:var(--text)}
.notice .msg.in{animation:nin .45s cubic-bezier(.2,1.2,.4,1)}
.notice .msg b{font-weight:900} .notice .msg .who{color:#ffd36b}
.notice.god{background:linear-gradient(90deg,#ff5a5a33,#ffd36b33,#5affb033,#5ab4ff33,#c45aff33);border-color:#fff8}
@keyframes nin{from{transform:translateY(100%);opacity:0}}
.acct{margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.acct p{margin:0 0 8px;font-size:12px;color:var(--muted)} .acct .who{font-weight:800;color:#ffd36b}
.acct .f{display:flex;gap:6px;margin-bottom:6px} .acct input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 10px;font:inherit}
.acct .f .btn{flex:1;padding:9px 6px;font-size:13px} .acct .err{color:var(--boom);font-size:12px;min-height:1em;margin:2px 0 0}
.acct .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-150%);background:#1d2030f2;border:1px solid #5a4a20;color:var(--xp);font-weight:800;padding:8px 14px 8px 8px;border-radius:12px;display:flex;align-items:center;gap:8px;z-index:20;transition:transform .35s cubic-bezier(.2,1.3,.4,1);box-shadow:0 8px 30px #000a}
.toast.on{transform:translate(-50%,0)}
.toast img{width:30px;height:30px;object-fit:contain}
/* 확률 */
.odds{margin-top:10px}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--panel2)}
.bar i{display:block;height:100%;transition:width .3s}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:5px;font-size:12px;color:var(--muted)}
.legend b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.pity{margin-top:8px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.pity .track{flex:1;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.pity .track i{display:block;height:100%;background:linear-gradient(90deg,#f08a4b,#ffd36b);transition:width .3s}
/* 버튼 */
.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:10px}
.btn{border-radius:14px;padding:13px 10px;font-weight:800;font-size:15px;background:var(--panel2);border:1px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.main{background:linear-gradient(180deg,#ffcf5a,#e09a1f);color:#2a1900;border:0;font-size:19px;box-shadow:0 6px 24px #e09a1f44;display:flex;flex-direction:column;align-items:center;justify-content:center}
.btn.main:active:not(:disabled){transform:translateY(2px)}
.btn.main small{font-size:12px;font-weight:700;opacity:.8;display:flex;align-items:center;gap:4px}
.btn.sell small{display:block;font-size:12px;font-weight:600;color:var(--gold)}
.hint{font-size:11px;color:var(--muted);text-align:right;margin-top:4px}
.row2{display:flex;gap:8px;margin-top:6px;align-items:stretch}
.toggle{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--shard)}
.btn.small{padding:8px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.btn.small small{color:var(--shard);font-weight:600}
/* 로그 */
.log{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px;max-height:170px;overflow:auto;font-size:13px}
.log p{margin:5px 0;color:var(--muted)} .log p:first-child{color:var(--text)}
.c-ok{color:var(--ok)!important}.c-keep{color:var(--keep)!important}.c-fail{color:var(--fail)!important}.c-boom{color:var(--boom)!important}.c-ev{color:#d6b3ff!important}.c-gold{color:var(--gold)!important}.c-xp{color:var(--xp)!important}
/* 모달 */
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;width:100%;max-width:440px;max-height:88vh;overflow:auto;animation:in .2s ease-out}
@keyframes in{from{transform:translateY(12px) scale(.97);opacity:0}}
.card,.log{scrollbar-width:thin;scrollbar-color:#4a4536 transparent}
.card::-webkit-scrollbar,.log::-webkit-scrollbar{width:8px}
.card::-webkit-scrollbar-track,.log::-webkit-scrollbar-track{background:transparent}
.card::-webkit-scrollbar-thumb,.log::-webkit-scrollbar-thumb{background:#4a4536;border-radius:8px;border:2px solid var(--panel)}
.card::-webkit-scrollbar-thumb:hover,.log::-webkit-scrollbar-thumb:hover{background:#6b6347}
.credits{margin-top:12px;font-size:12px;color:#a9a6a0;line-height:1.6}
.credits summary{cursor:pointer;color:#cfc8b8;font-size:13px}
.credits a{color:#d9b56a}
.card h3{margin:0 0 6px;font-size:20px;display:flex;align-items:center;gap:8px}
.card p{margin:6px 0;color:#cfcac0;line-height:1.5;font-size:14px}
.card .scene{width:100%;aspect-ratio:1.6;object-fit:cover;border-radius:12px;display:block;margin-bottom:10px;background:#000}
.card .bigbadge{display:block;width:150px;height:150px;object-fit:contain;margin:4px auto 8px;filter:drop-shadow(0 0 24px #ffd36b66);animation:spinin .8s cubic-bezier(.2,1.3,.4,1)}
@keyframes spinin{from{transform:scale(.2) rotate(-200deg);opacity:0}}
.choices{display:flex;gap:8px;margin-top:12px}
.choices .btn{flex:1}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.dex div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;font-size:11px;color:var(--muted)}
.dex img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.dex .lock img{filter:brightness(0) contrast(0) opacity(.5)}
.dex b{display:block;color:var(--text);font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;font-size:13px}
.stats div{background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--muted)} .stats b{color:var(--text);float:right}
.stat{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px}
.stat img{width:40px;height:40px;object-fit:contain;flex:none}
.stat .d{flex:1;min-width:0}
.stat .d b{font-size:14px} .stat .d b span{color:var(--xp);margin-left:6px}
.stat .d p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.stat .plus{width:38px;height:38px;border-radius:10px;background:linear-gradient(180deg,#ffcf5a,#e09a1f);color:#2a1900;font-weight:900;font-size:20px;flex:none}
.stat .plus:disabled{background:var(--panel2);color:var(--muted)}
.ranks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.ranks div{text-align:center;font-size:11px;color:var(--muted)} .ranks img{width:100%;aspect-ratio:1;object-fit:contain}
.ranks .lock img{filter:brightness(0) opacity(.4)}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:4px;text-align:right;border-bottom:1px solid var(--line)} .tbl th{color:var(--muted);font-weight:600}
.tbl td:first-child,.tbl th:first-child{text-align:left}

.workshop{margin-top:12px;padding:14px;border:1px solid #3c424e;border-radius:14px;background:linear-gradient(135deg,#1d241f,#151922)}
.workhead{display:flex;flex-direction:column;gap:4px}.workhead b{color:#e5cb8c;font-size:14px}.workhead span,.workshop p{font-size:12px;color:#aaa99f}.workshop p{margin:10px 0 0;line-height:1.5}
.workactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.workactions .btn{padding:13px 6px;background:#292d30;border:1px solid #4a5046}.workactions small{display:block;font-size:11px;color:#c8c1aa;margin-top:5px}
.worktarget{text-align:center;font-size:22px;color:#ffd36b;background:#24291e;border:1px solid #5d6747;border-radius:12px;padding:18px 8px;margin:14px 0}.workgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.workgrid button{min-height:64px;background:#272c36;border:1px solid #606573;border-radius:12px;font-weight:800;font-size:17px}.workgrid button:focus-visible{outline:3px solid #ffd36b}.workgrid button:disabled{opacity:.55}.workprogress{height:6px;border-radius:8px;background:#262c32;overflow:hidden}.workprogress i{display:block;height:100%;background:#9fc287}.workstatus{min-height:22px;text-align:center;color:#bfcbad!important;font-size:13px!important}
.mode-note{color:#b3c3b7;font-size:12px;margin:8px 0}
.work-icon{display:block;width:42px;height:42px;flex:none;object-fit:contain;filter:drop-shadow(0 2px 3px #0007);pointer-events:none}
.worktitle{display:inline-flex;align-items:center;justify-content:center;gap:7px}.worktitle .work-icon{width:34px;height:34px}.workactions small{margin-top:3px}
.card h3 .work-icon{width:32px;height:32px}.worktarget{display:flex;align-items:center;justify-content:center;gap:10px;min-height:86px;padding:12px 8px}.worktarget .work-icon{width:58px;height:58px}.worktarget .workverb{font-size:14px;font-weight:500;color:#bac1a9}.worktarget .workitem{display:inline-flex;align-items:center;gap:8px}
.workgrid button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:78px;padding:10px 4px;transition:background .15s,border-color .15s}.workgrid button:not(:disabled):hover{background:#333c42;border-color:#b8a476}.workgrid .workname{white-space:nowrap;line-height:1.2}
@media(max-width:380px){.workgrid{gap:7px}.workgrid button{gap:4px;font-size:15px;min-height:70px}.workgrid .work-icon{width:32px;height:32px}.worktitle{gap:4px}.worktitle .work-icon{width:28px;height:28px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="notice" id="notice"><span class="ico">📢</span><div class="msg" id="noticeMsg"></div></div>
  <div class="smith">
    <img class="badge" id="badge" alt="">
    <div class="info">
      <div class="rk"><small id="smLv">1레벨</small><span id="smRank"></span></div>
      <div class="xpbar"><i id="xpBar"></i></div>
      <div class="xpt" id="xpTxt"></div>
    </div>
    <button class="sq" id="bStat" title="스탯"><img data-art="icon-xp" alt="스탯"><span class="dot" id="ptDot"></span></button>
    <button class="sq" id="bDex" title="도감"><img data-art="icon-book" alt="도감"></button>
    <button class="sq" id="bInfo" title="규칙"><img data-art="icon-info" alt="규칙"></button>

function nextNotice(){
  const box=$("notice"), m=$("noticeMsg"), n=noticeQ.shift();
  if(!n){ noticeBusy=false; box.classList.remove("on","god"); return; }
  noticeBusy=true; box.classList.add("on"); box.classList.toggle("god",n.lv>=20);

const FEED=(()=>{ let ch=null; try{ ch=new BroadcastChannel("swordforge-feed"); }catch(e){}

  return { post(n){ seen.add(n.id); try{ ch&&ch.postMessage(clean(n)); }catch(e){} },
           listen(fn){ const take=n=>{ if(ok(n)){ seen.add(n.id); fn(clean(n)); } };

const volGain=()=>VOL.m?0:Math.pow(VOL.v/100,2)*1.43; // 사람 귀에 맞게 제곱 곡선, 70% ≈ 기존 음량
function setVol(){ try{ localStorage.setItem("swordforge-vol",JSON.stringify(VOL)); }catch(e){}
  if(MASTER&&AC) MASTER.gain.setTargetAtTime(volGain(),AC.currentTime,.03);
  const off=VOL.m||VOL.v===0, lv=off?0:VOL.v<40?1:2;
  $("volIco").innerHTML='<path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/>'+(off?'<path d="m16 9 6 6M22 9l-6 6"/>':(lv>=1?'<path d="M15.5 8.5a5 5 0 0 1 0 7"/>':'')+(lv>=2?'<path d="M18.5 5.5a9 9 0 0 1 0 13"/>':''));
  $("volR").value=VOL.v; $("volT").textContent=off?"끔":VOL.v+"%"; $("volM").checked=VOL.m; }
function ac(){
  if(AC) return AC;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  // 전체 버스: 압축기 → 출력. 잔향(대장간 공간감)은 따로 섞는다
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=3; comp.knee.value=12; comp.attack.value=.02; comp.release.value=.3;
  // 공격 시간이 너무 짧으면 저음(쿠구궁) 파형 한 주기 안에서 음량이 출렁여 깨진다 → 느슨하게
  const lim=AC.createDynamicsCompressor(); lim.threshold.value=-2; lim.knee.value=0; lim.ratio.value=20; lim.attack.value=.006; lim.release.value=.25;
  const trim=AC.createGain(); trim.gain.value=.8; // 압축기 자동 보정 게인 상쇄 → 리미터가 거의 안 걸리게
  MASTER=AC.createGain(); MASTER.gain.value=volGain();
  comp.connect(trim).connect(lim).connect(MASTER).connect(AC.destination);
  BUS=AC.createGain(); BUS.gain.value=.9; BUS.connect(comp);
  const len=AC.sampleRate*1.6, ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2); }
  REV=AC.createConvolver(); REV.buffer=ir; const rg=AC.createGain(); rg.gain.value=.22; REV.connect(rg).connect(comp);
  return AC;
}
const out=(node,wet=.5)=>{ node.connect(BUS); if(wet>0){ const g=AC.createGain(); g.gain.value=wet; node.connect(g).connect(REV); } };

const PEAK={"charge_ice.wav":.93,"charge_fire.wav":1.12,"charge_elec.wav":.49};
const FILES={}; let smpLoading=false;
function loadSmp(){
  if(smpLoading) return; smpLoading=true;
  const fs=new Set(); Object.values(LIB).forEach(v=>v.forEach(x=>fs.add(x[0])));
  fs.forEach(f=>fetch(`sfx/v2/${f}`).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>AC.decodeAudioData(b)).then(buf=>{
    // 녹음마다 크기가 달라 최고점을 0.9로 맞춘다 (증기 소리는 원본이 5배 작다)
    let pk=0; for(let c=0;c<buf.numberOfChannels;c++){ const d=buf.getChannelData(c); for(let i=0;i<d.length;i++) pk=Math.max(pk,Math.abs(d[i])); }
    if(pk>0&&(pk<.85||pk>.95)){ const k=.9/pk; for(let c=0;c<buf.numberOfChannels;c++){ const d=buf.getChannelData(c); for(let i=0;i<d.length;i++) d[i]*=k; } }
    FILES[f]=buf;

}

// 구간: 0(1~5) 1(6~10) 2(11~15) 3(16~20). 강화 시작 단계 기준
let SND_LV=0; const band=()=>SND_LV<=5?0:SND_LV<=10?1:SND_LV<=15?2:3;
// s(묶음, 크기, 지연, 재생속도(낮을수록 낮고 길게), 잔향, {at: 묶음 안 번호, upTo: 이 시각에 정점이 오도록})
function snd(group,vol=.6,delay=0,rate=1,wet=.2,o={}){
  try{ const a=ac(); loadSmp(); const list=LIB[group]; if(!list) return false;
    const [f,off=0,dur=0]=list[o.at??(Math.random()*list.length|0)], buf=FILES[f]; if(!buf) return false;
    const r=rate*(1+(Math.random()-.5)*.04), src=a.createBufferSource(), g=a.createGain();
    src.buffer=buf; src.playbackRate.value=r;
    const lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=o.lp||9500; lp.Q.value=.5; // 귀 아픈 고음 정리
    // 노트북·폰 스피커가 못 내는 초저음은 깎는다 (깨짐의 원인)
    const hp=a.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=o.hp||35; hp.Q.value=.6;
    src.connect(hp).connect(lp).connect(g); out(g,wet);
    let t=a.currentTime+delay, st=off, len=dur?dur:buf.duration-off;
    if(o.upTo){ const pk=PEAK[f]||buf.duration; st=Math.max(0,pk-o.upTo*r); len=pk-st+.12; } // 정점 직후 0.12초까지만
    // 잘라 쓴 소리는 끝을 부드럽게 닫아 "툭" 끊기는 잡음을 막는다
    g.gain.setValueAtTime(vol,t); const end=t+len/r; g.gain.setValueAtTime(vol,Math.max(t,end-.06)); g.gain.linearRampToValueAtTime(0,end);
    src.start(t,st,len+.01); return true;
  }catch(e){ return false; } }
const SFX={

  // ⑤ 유지(방어 성공): 달군 쇠를 물에 담그는 "치이익" + 쇠가 멈추는 짧은 소리

  // 기타
  ev:()=>{ snd("chime",.5,0,1,.4); },
  coin:()=>{ snd("coin",.6); },

// ── 미리듣기: 주소 뒤에 ?sfxtest 를 붙이면 열린다 ──
function sfxPanel(){
  const bands=[["1~5",3],["6~10",8],["11~15",13],["16~20",18]];
  const ev=[["모루질","clang"],["충전","beat"],["성공","ok"],["대성공","great"],["유지","keep"],["실패","fail"],["파괴","boom"],["승급","tierup"],["신급 승급","god"]];
  const run=async(k,lv)=>{ SND_LV=lv; ac(); loadSmp();
    if(k==="god") return SFX.tierup(true); if(k==="beat") return SFX.beat((180+lv*12)/1000); SFX[k](); };
  const flow=async(k,lv)=>{ SND_LV=lv; const hits=1+Math.floor(lv/7);
    for(let i=0;i<hits;i++){ if(i===hits-1&&hits>1) await wait(300); SFX.clang(1+i*.08); await wait(150); }
    if(lv>=10){ const w=180+lv*12; SFX.beat(w/1000); await wait(w); } SFX[k](); };
  const box=document.createElement("div");
  box.style.cssText="position:fixed;inset:auto 8px 8px 8px;z-index:99;background:#14161cf2;border:1px solid #3a3f4b;border-radius:10px;padding:10px;font:13px sans-serif;color:#dde;max-height:60vh;overflow:auto";
  let h="<b>효과음 미리듣기</b> — 구간별 단일 소리 / ▶흐름 = 망치질→충전→결과를 실제 게임 시간대로<table style='border-collapse:collapse;margin-top:6px'>";
  h+="<tr><td></td>"+bands.map(b=>`<td style='padding:2px 6px'>${b[0]}단계</td>`).join("")+"</tr>";
  ev.forEach(([nm,k])=>{ h+=`<tr><td style='padding:2px 6px'>${nm}</td>`+bands.map(b=>`<td><button data-k="${k}" data-l="${b[1]}">듣기</button>${["ok","great","fail","boom","keep"].includes(k)?` <button data-f="${k}" data-l="${b[1]}">▶흐름</button>`:""}</td>`).join("")+"</tr>"; });
  h+="</table><details style='margin-top:6px'><summary>원본 녹음 하나씩 듣기</summary><div id='rawlist'></div></details>";
  box.innerHTML=h; document.body.appendChild(box);
  box.querySelector("#rawlist").innerHTML=Object.entries(LIB).map(([g,l])=>`<div><b>${g}</b> `+l.map((x,i)=>`<button data-raw="${g}" data-i="${i}" style="margin:2px">${i+1}</button>`).join("")+"</div>").join("");
  box.addEventListener("click",e=>{ const t=e.target.closest("button"); if(!t) return;
    if(t.dataset.raw){ ac(); loadSmp(); snd(t.dataset.raw,.7,0,1,.1,{at:+t.dataset.i}); return; }
    if(t.dataset.f) return flow(t.dataset.f,+t.dataset.l); run(t.dataset.k,+t.dataset.l); });
}

// GPT 그림 속 오라처럼 보이게: ① 물건 자체를 흐리게 키운 "블룸"(물건 색 그대로 번짐)
// ② 프랙탈 노이즈로 만든 연기 질감 오라가 위로 타오름 (fx2-aura 이미지가 없을 때의 대체이자 보강)
const SMOKE=(()=>{ const N=128, c=document.createElement("canvas"); c.width=c.height=N; const g=c.getContext("2d"), im=g.createImageData(N,N);
  const rnd=[]; for(let o=0;o<4;o++){ const s=4<<o, a=[]; for(let i=0;i<s*s;i++) a.push(Math.random()); rnd.push([s,a]); }
  const sm=t=>t*t*(3-2*t);
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ let v=0,amp=.5;
    for(const [s,a] of rnd){ const fx=x/N*s, fy=y/N*s, x0=Math.floor(fx), y0=Math.floor(fy), tx=sm(fx-x0), ty=sm(fy-y0), A=(i,j)=>a[((j%s)*s)+(i%s)];
      v+=amp*((A(x0,y0)*(1-tx)+A(x0+1,y0)*tx)*(1-ty)+(A(x0,y0+1)*(1-tx)+A(x0+1,y0+1)*tx)*ty); amp*=.5; }
    const k=(y*N+x)*4, w=Math.max(0,Math.min(255,(v-.35)*2.4*255)); im.data[k]=im.data[k+1]=im.data[k+2]=w; im.data[k+3]=255; }
  g.putImageData(im,0,0); return c; })();
SPR["smoke-tex"]=SMOKE;
// 연기 오라 한 겹: 세로로 흐르는 노이즈를 타원 그라데이션으로 오려 원소색으로 칠한다
const AURA_C=document.createElement("canvas"), ag=AURA_C.getContext("2d"); AURA_C.width=AURA_C.height=200;
function smokeAura(col,T,speed){
  const S_=200; ag.globalCompositeOperation="source-over"; ag.clearRect(0,0,S_,S_);
  const off=(T*speed*60)%S_; const tex=tinted("smoke-tex",col);
  ag.globalAlpha=1; ag.drawImage(tex,0,-off,S_,S_); ag.drawImage(tex,0,S_-off,S_,S_);
  ag.globalAlpha=.6; ag.drawImage(tex,-30,-(off*1.6)%S_,S_*1.3,S_); ag.drawImage(tex,-30,S_-(off*1.6)%S_,S_*1.3,S_);
  ag.globalAlpha=1; ag.globalCompositeOperation="destination-in";
  const gr=ag.createRadialGradient(S_/2,S_*.58,0,S_/2,S_*.58,S_/2); gr.addColorStop(0,"#000"); gr.addColorStop(.55,"rgba(0,0,0,.7)"); gr.addColorStop(1,"rgba(0,0,0,0)");
  ag.fillStyle=gr; ag.fillRect(0,0,S_,S_); return AURA_C; }

// 별 배경(신급) 좌표는 한 번만 만든다
const STARS=Array.from({length:70},()=>[Math.random(),Math.random(),Math.random()*6]);
// 물건 움직임 상태: 둥실·흔들림·컷인 확대·실패 가라앉기를 한 곳에서 합친다
const OBJ={zoom:1,sink:0,fade:1,bright:1};
let swordFilterBase="";
function drawRunes(g,x,y,r,rot,col,alpha){
  g.save(); g.translate(x,y); g.scale(1,.34); g.rotate(rot); g.globalAlpha=alpha;
  const im=SPR["fx2-runecircle"]&&tinted("fx2-runecircle",col);
  if(im){ g.drawImage(im,-r,-r,2*r,2*r); g.restore(); return; }
  g.strokeStyle=col; g.lineWidth=2*DPR();
  g.beginPath(); g.arc(0,0,r,0,7); g.stroke(); g.beginPath(); g.arc(0,0,r*.8,0,7); g.stroke();
  g.beginPath(); for(let i=0;i<=6;i++){ const a=i*Math.PI*2/6*2; g.lineTo(Math.cos(a)*r*.8,Math.sin(a)*r*.8); } g.stroke();
  for(let i=0;i<24;i++){ const a=i/24*Math.PI*2, q=i%3?.92:.97; g.beginPath(); g.moveTo(Math.cos(a)*r*.86,Math.sin(a)*r*.86); g.lineTo(Math.cos(a)*r*q,Math.sin(a)*r*q); g.stroke(); }
  g.restore();
}
function drawRays(g,x,y,R,rot,col,alpha,n=12){
  const im=SPR["fx2-rays"]&&tinted("fx2-rays",col);
  g.save(); g.translate(x,y); g.rotate(rot); g.globalAlpha=alpha;
  if(im){ g.drawImage(im,-R,-R,2*R,2*R); g.restore(); return; }
  const gr=g.createRadialGradient(0,0,0,0,0,R); gr.addColorStop(0,col); gr.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle=gr;
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; g.beginPath(); g.moveTo(0,0); g.arc(0,0,R,a-.07,a+.07); g.closePath(); g.fill(); }
  g.restore();
}
function drawShard(g,x,y,s,rot,col,alpha){
  const im=SPR["fx2-shard"]&&tinted("fx2-shard",col);
  g.save(); g.translate(x,y); g.rotate(rot); g.globalAlpha=alpha;
  if(im) g.drawImage(im,-s/2,-s/2,s,s);
  else { // 빛나는 수정 조각: 원소색 겉면 + 흰 심
    g.shadowColor=col; g.shadowBlur=s*.6; g.fillStyle=col; g.beginPath(); g.moveTo(0,-s/2); g.lineTo(s/5,-s/10); g.lineTo(0,s/2); g.lineTo(-s/5,-s/10); g.closePath(); g.fill();
    g.shadowBlur=0; g.fillStyle="rgba(255,255,255,.85)"; g.beginPath(); g.moveTo(0,-s/2.6); g.lineTo(s/12,-s/12); g.lineTo(0,s/4); g.lineTo(-s/12,-s/12); g.closePath(); g.fill(); }
  g.restore();
}
let lastT=performance.now(), ppsAcc=0;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now; const T=now/1000; hueT=(T*60)%360;
  const W=bv.width,H=bv.height,d=DPR(), l=S.lv, E=ELEM(S.path,l), P=tierParams(l), t=tierOf(l);
  const breath=P.breath?.85+.15*Math.sin(T*2.1):1, cx0=W/2, cy0=H*CY;
  // ── 뒤쪽 레이어: 별 → 배경 물듦 → 광선 → 오라 → 룬진 → 뒤쪽 회전 파편
  bx.clearRect(0,0,W,H); bx.globalCompositeOperation="lighter";
  if(t>=5){ bx.fillStyle="#fff"; for(const [sx,sy,ph] of STARS){ bx.globalAlpha=.25+.35*Math.abs(Math.sin(T*1.3+ph)); bx.fillRect(sx*W,sy*H,1.6*d,1.6*d); } }
  if(t>=4){ bx.globalAlpha=t>=5?.14:.09; bx.fillStyle=colA(E,0); bx.fillRect(0,0,W,H); }
  if(P.rays){ drawRays(bx,cx0,cy0,W*.75,T*.12,colA(E,0),.22*P.i);
    if(P.rays>1) drawRays(bx,cx0,cy0,W*.7,-T*.18,colA(E,180),.18*P.i,9); }
  if(P.a>0){
    const R=P.a*W*.62, has=!!SPR["fx2-aura"];
    for(const [o,sc,al] of [[0,1,1],[1,.62,.9]]){
      const col=colA(E,o*120);
      if(has){ bx.globalAlpha=P.i*breath*al; bx.drawImage(tinted("fx2-aura",col),cx0-R*sc,cy0-R*sc*1.25,2*R*sc,2.5*R*sc); }
      else { bx.save(); bx.translate(cx0,cy0); bx.scale(.8,1.2); const gr=bx.createRadialGradient(0,0,0,0,0,R*sc);
        gr.addColorStop(0,col); gr.addColorStop(1,"rgba(0,0,0,0)");
        bx.globalAlpha=P.i*breath*al*.35; bx.fillStyle=gr; bx.beginPath(); bx.arc(0,0,R*sc,0,7); bx.fill(); bx.restore(); }
    }
    // 연기 질감 오라: 등급이 오를수록 빠르고 크게 타오른다
    const sa=smokeAura(colA(E,0),T,.25+t*.12), w2=R*2*.95, h2=R*2*1.45;
    bx.globalAlpha=Math.min(1,P.i*1.5)*breath; bx.drawImage(sa,cx0-w2/2,cy0-h2*.6,w2,h2); if(t>=3){ bx.globalAlpha=P.i*.6*breath; bx.drawImage(sa,cx0-w2*.6,cy0-h2*.75,w2*1.2,h2*1.15); }
    if(E.c2!==E.c1||E.rainbow){ const sb=smokeAura(colA(E,120),T+7,.35+t*.1); bx.globalAlpha=P.i*.7*breath; bx.drawImage(sb,cx0-w2*.35,cy0-h2*.5,w2*.7,h2*.8); }
  }
  // 블룸: 물건 그림 자체를 흐리게 키워 뒤에 깐다 → 그림 속 색 그대로 빛이 번진다
  const swi=$("sword");
  if(t>=1 && swi.complete && swi.naturalWidth){
    const sz=W*.84, bl=(6+t*5)*d;
    bx.save(); bx.filter=`blur(${bl}px) saturate(1.6)`; bx.globalAlpha=(.25+t*.12)*breath;
    const s2=sz*(1.05+t*.03); bx.drawImage(swi,cx0-s2/2,H*.46-s2/2+(OBJ.sink||0)*d,s2,s2);
    if(t>=3){ bx.globalAlpha=.18*breath; const s3=sz*1.25; bx.drawImage(swi,cx0-s3/2,H*.46-s3/2-H*.03,s3,s3); }
    bx.restore();
  }
  if(P.rune){ drawRunes(bx,cx0,H*.86,W*.34,T*.35,colA(E,0),.55*P.i);
    if(P.rune>1) drawRunes(bx,cx0,H*.86,W*.25,-T*.5,colA(E,120),.5*P.i); }
  const orbit=[];

    orbit.push([cx0+Math.cos(a)*W*.36, cy0+z*W*.07+Math.sin(T*1.7+i)*W*.02, (14+z*5)*d*1.6, a*2, colA(E,i%2*120), .55+.35*z, z]); }
  for(const o of orbit) if(o[6]<0) drawShard(bx,o[0],o[1],o[2],o[3],o[4],o[5]);
  bx.globalAlpha=1; bx.globalCompositeOperation="source-over";

  // ── 물건 움직임 (망치질 중에는 CSS 떨림이 맡는다)
  const sw=$("sword");
  if(!$("stage").classList.contains("charging")){
    const bob=P.bob?Math.sin(T*Math.PI*2/P.bob)*6:0, sh=P.shake, jx=sh?(Math.random()-.5)*sh:0, jy=sh?(Math.random()-.5)*sh:0;
    sw.style.transform=`translate(calc(-50% + ${jx.toFixed(2)}px), calc(-50% + ${(bob+jy+OBJ.sink).toFixed(2)}px)) scale(${OBJ.zoom})`;
  } else sw.style.transform="";
  sw.style.opacity=OBJ.fade;
  sw.style.filter=((OBJ.bright!==1?`brightness(${OBJ.bright}) `:"")+swordFilterBase)||"none";

  // ── 앞쪽 레이어: 앞쪽 회전 파편 + 파티클
  ppsAcc+=P.pps*dt; while(ppsAcc>=1){ ppsAcc--; ambientParticle(E,t); }
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  cx.globalCompositeOperation="lighter";
  for(const o of orbit) if(o[6]>=0) drawShard(cx,o[0],o[1],o[2],o[3],o[4],o[5]);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=p.drag; p.life--; p.rot+=p.vr; p.size+=p.grow;
    const a=Math.max(0,p.life/p.max); cx.globalAlpha=(p.spr.endsWith("shard")?Math.min(1,a*1.5):a)*p.alpha;
    const im=p.tint?tinted(p.spr,p.tint):SPR[p.spr];
    if(im){ cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.drawImage(im,-p.size/2,-p.size/2,p.size,p.size); cx.restore(); }
    else { cx.fillStyle=p.tint||"#ffd36b"; cx.beginPath(); cx.arc(p.x,p.y,Math.max(1,p.size/6),0,7); cx.fill(); } }
  cx.globalAlpha=1; cx.globalCompositeOperation="source-over";
}
(function loop(now){ try{ frame(now||performance.now()); }catch(e){ console.error(e); } requestAnimationFrame(loop); })();
function flash(color,ms=380,peak=.75){ const f=$("flash"); f.style.transition="none"; f.style.background=color; f.style.opacity=peak; requestAnimationFrame(()=>{ f.style.transition=`opacity ${ms}ms`; f.style.opacity=0; }); }
function banner(t,color){ const b=$("banner"); b.textContent=t; b.style.color=color; b.classList.remove("show"); void b.offsetWidth; b.classList.add("show"); }
function shake(big){ const s=$("stage"); s.classList.remove("shake","big"); void s.offsetWidth; s.classList.add("shake"); if(big) s.classList.add("big"); }
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function tween(ms,fn){ return new Promise(res=>{ const t0=performance.now(); (function st(n){ const k=Math.max(0,Math.min(1,(n-t0)/ms)); fn(k); if(k<1) requestAnimationFrame(st); else res(); })(t0); }); }
// 등급 승급 컷인: 배경 암전 → 물건 확대 → 등급 이름. 신급은 2초 전용
async function tierCutin(l){
  const t=tierOf(l), E=ELEM(S.path,l), god=t===5, c=$("cutin"), st=$("stage"), ms=god?2000:800;
  c.className="cutin"+(god?" god":""); c.style.setProperty("--d",ms+"ms"); c.style.color=tierColor(l);
  c.innerHTML=`<small>승급</small><b>${TIERS[t]}</b>`; void c.offsetWidth; c.classList.add("on");
  st.classList.add("cut"); SFX.tierup(god); if(god) flash("#ffffff",900,.95);
  tween(ms*.3,k=>OBJ.zoom=1+.15*k);
  emit(god?120:50,{spr:pick("fx2-flare","fx-spark"),tint:god?()=>rb(Math.random()*360):colA(E,0),speed:god?12:8,life:70,size:28,grav:.02});
  ring(colA(E,0),god?2:1.3); if(god){ await wait(300); ring(rb(120),2.4); ring(rb(240),3); }
  await wait(ms*.75); tween(ms*.25,k=>OBJ.zoom=1.15-.15*k); st.classList.remove("cut"); await wait(ms*.25);
  c.classList.remove("on");
}

let busy=false, holding=false;
function unavailable(){return busy||requestBusy||!accountReady||!tabReady;}
async function enhance(){
  if(unavailable()||S.lv>=MAX||$("modal").classList.contains("on"))return false;
  if(!S.buffs.cat&&S.gold<cost(S.lv))return false;
  busy=true;holding=!!holding;const old=structuredClone(S),from=S.lv;SND_LV=from;render();
  try{
    const stage=$("stage");stage.classList.add("charging");SFX.clang();emit(12,{spr:"fx-spark",y:.5,speed:6,grav:.25,life:22,size:18});
    const r=await dispatch({type:"enhance"});await wait(from>=10?550:160);stage.classList.remove("charging");
    if(!r)return false;const o=r.out;
    setSword(S.lv);const E=ELEM(S.path,S.lv);
    if(o.result==="ok"){
      if(o.fork)await forkReveal(o.fork);
      banner(o.great?"대성공 +2":"성공",o.great?"#ffd36b":"#4fd18b");o.great?SFX.great():SFX.ok();flash(E.c1+"77");ring(E.c1);emit(35+S.lv*2,{spr:"fx-spark",speed:8,grav:.06,life:50,size:24});
      log(`${o.great?"대성공":"성공"} +${from} → +${S.lv} ${nameOf(S.path,S.lv)}`,"c-ok");announce(S.lv,S.path,o.great);
      if(tierOf(S.lv)>tierOf(from)){await wait(700);await tierCutin(S.lv);}
    }else if(o.result==="keep"){banner("유지","#8fa3c4");SFX.keep();log(`유지 +${S.lv}`,"c-keep");}
    else if(o.result==="fail"){banner("실패 −1","#f08a4b");SFX.fail();shake();log(`실패 +${from} → +${S.lv}`,"c-fail");}
    else if(o.protected){banner("방지!","#7fd3ff");SFX.keep();flash("#7fd3ff55");log(`방지권으로 +${from} 유지 (남은 ${S.prot}장)`,"c-keep");}
    else{banner("파괴","#ff4d5e");SFX.boom();flash("#ff1e3c",650);shake(true);emit(40,{spr:"fx-shard",speed:12,grav:.4,life:65,size:35});log(`파괴! +${from} ${nameOf(old.path,from)} · 파편 +${o.shards}`,"c-boom");await wait(900);}
    if(S.smith.lv>old.smith.lv){toast("icon-xp",`대장장이 ${S.smith.lv}레벨 · 스탯 포인트 획득`);log(`대장장이 레벨 업 → ${S.smith.lv}레벨`,"c-xp");}
    if(o.ending){ending();return false;}
    if(S.event){randomEvent();return false;}
    if(Forge.rankOf(S.smith.lv)>Forge.rankOf(old.smith.lv)){showRankUp(Forge.rankOf(S.smith.lv));return false;}
    if(S.gold<cost(S.lv)&&!S.buffs.cat)log("골드가 부족해요. 광산 채굴이나 마을 잡일로 자금을 모아 보세요.","c-gold");
    await wait(Math.max(0,S.nextAction-Date.now()));
    return o.result!=="boom"&&!(o.fork&&PATHS[o.fork].rare)&&tierOf(S.lv)===tierOf(from)&&!(S.lv>old.best&&S.lv>=8);
  }catch(e){log(e.message,"c-fail");return false;}
  finally{busy=false;$("stage").classList.remove("charging");render();}
}
async function holdLoop(){if(holding||unavailable())return;holding=true;while(holding){if(!await enhance()){holding=false;break;}await wait(100);}}
async function sell(){
  if(unavailable()||!S.lv||$("modal").classList.contains("on"))return;
  if(S.lv>=10&&!confirm(`+${S.lv} ${nameOf(S.path,S.lv)}을(를) ${fmt(sellPrice(S.lv))}G에 판매할까요?`))return;
  const r=await dispatch({type:"sell"});if(!r)return;setSword(0);SFX.coin();log(`+${r.out.from} 판매 → ${fmt(r.out.price)}G`,"c-gold");
}

  });
  $("workCancel").onclick=async()=>{if(requestBusy)return;const r=await dispatch({type:"workCancel"});if(r)closeModal();};
  workTicker=setInterval(tick,100);tick();
}

const API="https://sword-forge-api.aicore-sj-relay.workers.dev";
const ACC_KEY="swordforge-acc";
let ACC=(()=>{ try{ const a=JSON.parse(localStorage.getItem(ACC_KEY)); if(a&&a.token) return a; }catch(e){} return null; })();
let cloudState="",cloudLast=0,requestBusy=false,accountReady=!ACC,tabReady=true,accountEpoch=0,accountBusy=false;
const setAcc=a=>{accountEpoch++;ACC=a;try{a?localStorage.setItem(ACC_KEY,JSON.stringify(a)):localStorage.removeItem(ACC_KEY);}catch(e){}};
async function api(path,body){
  const r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});
  const j=await r.json();if(!r.ok){const e=new Error(j.msg||"서버 연결이 안 돼요");e.code=j.error||r.status;e.state=j.state;throw e;}return j;
}
function adoptSave(json){
  const raw=typeof json==="string"?JSON.parse(json):json;
  if(!raw||raw.version!==Forge.VERSION)throw Error("저장 형식을 확인할 수 없어요. 새로고침해 주세요.");
  S=Forge.normalize(raw);save();setSword(S.lv);render();
}
async function dispatch(action){
  if(requestBusy||!accountReady||!tabReady)return null;
  const epoch=accountEpoch,token=ACC?.token;
  requestBusy=true;render();
  try{
    const execute=async()=>{
      if(epoch!==accountEpoch||ACC?.token!==token)throw Object.assign(new Error("계정이 변경됐어요."),{code:"session"});
      let r;
      if(ACC){
        const body={token,rev:S.rev,requestId:crypto.randomUUID(),action};
        try{r=await api("/action",body);}catch(e){if(e.code)throw e;r=await api("/action",body);}
        if(epoch!==accountEpoch||ACC?.token!==token)throw Object.assign(new Error("계정이 변경됐어요."),{code:"session"});
        S=Forge.normalize(r.state);cloudLast=r.saved;cloudState="ok";
      }else{
        // The Web Lock and re-read make a local mutation atomic across tabs.
        const cached=localStorage.getItem(KEY);if(cached)S=Forge.normalize(JSON.parse(cached));
        r=Forge.transition(S,action,Date.now(),()=>crypto.getRandomValues(new Uint32Array(1))[0]/4294967296);S=r.state;
      }
      save();return r;
    };
    return navigator.locks?await navigator.locks.request("swordforge-actions",execute):await execute();
  }catch(e){
    if(epoch!==accountEpoch)return null;
    if(e.state){S=Forge.normalize(e.state);save();setSword(S.lv);if(S.event)setTimeout(randomEvent,0);else if(S.work)setTimeout(showWork,0);}
    if(ACC&&!e.code){accountReady=false;cloudState="fail";setTimeout(cloudBoot,1200);}
    if(e.code==="auth"){accountReady=false;cloudState="fail";}
    toast("icon-xp",e.message);log(e.message,"c-fail");return null;
  }finally{requestBusy=false;render();if($("acct"))renderAcct();}
}
async function cloudBoot(){
  if(!ACC){accountReady=true;return;}
  const epoch=accountEpoch,token=ACC.token;
  accountReady=false;render();
  try{const r=await api("/load",{token});if(epoch!==accountEpoch||ACC?.token!==token)return;adoptSave(r.save);accountReady=true;cloudLast=r.saved;cloudState="ok";if(S.event)randomEvent();else if(S.work)showWork();}
  catch(e){if(epoch!==accountEpoch)return;cloudState="fail";log("계정 기록을 확인하지 못했어요. 능력치 화면에서 재연결하거나 로그아웃해 주세요.","c-fail");}
  finally{if(epoch===accountEpoch){render();if($("acct"))renderAcct();}}
}

    <div class="f"><input id="accName" maxlength="12" placeholder="닉네임 (2~12자)" autocomplete="username" aria-label="닉네임"></div>

    <div class="f"><button class="btn main" id="accNew">새로 만들기</button><button class="btn" id="accIn">불러오기</button></div>
    <p class="err" id="accErr"></p>`;
  $("accName").value=/^대장장이\d{4}$/.test(S.name)?"":S.name;
  const go=async(kind)=>{

    if(!/^[0-9A-Za-z가-힣_]{2,12}$/.test(name)) return err.textContent="닉네임은 한글·영문·숫자 2~12자 (띄어쓰기 없이)";
    if(!(kind==="new"?/^\d{6,8}$/:/^\d{4,8}$/).test(pin))return err.textContent=kind==="new"?"새 비밀번호는 숫자 6~8자리":"비밀번호는 숫자 4~8자리";
    accountBusy=true;const epoch=accountEpoch;
    err.textContent="잠시만요…"; box.querySelectorAll("button").forEach(b=>b.disabled=true);
    try{
      if(kind==="new"){ const r=await api("/register",{name,pin});if(epoch!==accountEpoch){await api("/logout",{token:r.token});return;}
        try{localStorage.setItem(KEY+"-backup",JSON.stringify(S));}catch(_){}setAcc({token:r.token,name:r.name});adoptSave(r.save);accountReady=true;cloudLast=r.saved;cloudState="ok";toast("icon-xp",`${r.name} 계정을 만들었어요`);renderAcct();render(); }
      else { const r=await api("/login",{name,pin});if(epoch!==accountEpoch){await api("/logout",{token:r.token});return;} setAcc({token:r.token,name:r.name});
        try{localStorage.setItem(KEY+"-backup",JSON.stringify(S));}catch(_){}adoptSave(r.save);accountReady=true;cloudLast=r.saved;cloudState="ok";renderAcct();render();if(S.event)randomEvent();else if(S.work)showWork(); }

    }catch(e){err.textContent=e.message;box.querySelectorAll("button").forEach(b=>b.disabled=false);}finally{accountBusy=false;}
  };
  $("accNew").onclick=()=>go("new"); $("accIn").onclick=()=>go("login");
  $("accPin").onkeydown=e=>{ if(e.key==="Enter") go("login"); };

  <p><b>대성공</b>: +12 이하 성공 시 일정 확률로 +2 (힘).<br><b>장인의 집념</b>: 유지·실패마다 성공 확률 +5%(상대), 최대 +50%. 성공·파괴 시 초기화. 집념·손재주·컨디션의 상대 보너스는 고강화에서도 그대로 적용된다. 집중은 파괴 위험을 유지로 전환해 방지권과 함께 사용해도 유리하다.<br><b>파괴방지권</b>: 파괴 대신 소모. 파괴된 검 파편 ${PROT_COST}개로 구매. 저단계에서 파편을 반복 수급하는 효율을 낮췄다.<br><b>대장장이 성장</b>: 두드릴 때마다 경험치. 파괴는 가장 큰 교훈. 레벨업으로 스탯을 찍고 직급이 오른다.<br><b>판매</b>: 저단계 즉시 판매는 손해. +7~+10 구간부터 현금화를 고민할 수 있다. 고강화 판매가도 완화된 확률에 맞춰 조정했다. 판매 경험치는 없다.<br><b>일거리</b>: 광산 5단계 260G / 잡일 4단계 180G. 1,000G 미만이면 일당 +50%. 주문·위치가 매번 바뀌며 단계당 최소 0.9초, 제한 14초. 완료·포기 후 대기, 10분당 최대 30회 접수.<br><b>계정 보호</b>: 로그인 플레이는 서버가 확률·비용·보상을 계산한다. 기기 플레이의 저장파일 직접 조작까지 막을 수는 없다.</p>
  <p><b>갈림길</b>: 나뭇가지(+0)에서 처음 성공하면 무기의 길이 정해진다. 0으로 돌아가면 다시 갈림길.<br>

up.addEventListener("click",e=>{if(e.isTrusted&&e.detail===0)enhance();});
["pointerup","pointerleave","pointercancel"].forEach(t=>up.addEventListener(t,()=>holding=false));

addEventListener("keyup",e=>{ if(e.code==="Space") holding=false; });
