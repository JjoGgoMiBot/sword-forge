<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쪼꼬미랜드 음악 미리듣기</title><link rel="stylesheet" href="style.css"><style>body{overflow:auto}main{max-width:800px;margin:auto}article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}audio{width:100%;margin-top:12px}h2{font-size:18px}</style><main><h1>랜드 음악 미리듣기</h1><p>광장 · 오락관 · 대장간 · 타로관</p><button id="prepare" class="primary">네 곡 준비하기</button><p id="status" role="status">준비 후 각 곡을 따로 들어볼 수 있어요.</p><div id="tracks"></div></main><script type="module">
import {getSound} from './sound/sound.js?v=3';import {MUSIC_PLAN} from './sound/score.js?v=1';import {loudness} from './sound/dsp.js';
const ids={town:'town',casino:'lounge',forge:'forge',fortune:'mist'},sound=getSound();
function wav(ch,sr){const n=ch[0].length,b=new ArrayBuffer(44+n*4),v=new DataView(b),str=(p,s)=>[...s].forEach((c,i)=>v.setUint8(p+i,c.charCodeAt()));str(0,'RIFF');v.setUint32(4,36+n*4,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,sr,true);v.setUint32(28,sr*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,n*4,true);for(let i=0;i<n;i++)for(let c=0;c<2;c++)v.setInt16(44+(i*2+c)*2,Math.round(Math.max(-1,Math.min(1,ch[c][i]))*32767),true);return new Blob([b],{type:'audio/wav'});}
document.querySelector('#prepare').onclick=async e=>{e.target.disabled=true;try{for(const [place,concept]of Object.entries(ids)){const plan=MUSIC_PLAN[place];document.querySelector('#status').textContent=plan.title+' 준비 중…';const a=await sound.renderOffline('bgm',{concept,sampleRate:32000}),m=loudness(a.channels,a.sampleRate);if(!Number.isFinite(m.integrated)||m.peak>0)throw Error('오디오 확인 필요');const article=document.createElement('article');article.dataset.verified=place;article.innerHTML='<h2>'+plan.title+'</h2><p>'+plan.feel+' · '+plan.bpm+' BPM</p>';const audio=document.createElement('audio');audio.controls=true;audio.loop=true;audio.src=URL.createObjectURL(wav(a.channels,a.sampleRate));article.append(audio);document.querySelector('#tracks').append(article);}document.querySelector('#status').textContent='네 곡 준비 완료';}catch(error){document.querySelector('#status').textContent=error.message;e.target.disabled=false;}};
</script></html>
